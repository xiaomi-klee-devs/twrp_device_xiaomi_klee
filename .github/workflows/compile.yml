name: Build and publish OrangeFox klee

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use for the build job'
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - ubuntu-24.04
      publish:
        description: 'Create a prerelease with vendor_boot'
        required: true
        default: true
        type: boolean
      run_checkout:
        description: 'Step: Check out device tree'
        required: false
        default: true
        type: boolean
      run_metadata:
        description: 'Step: Set build metadata'
        required: false
        default: true
        type: boolean
      run_remove_worktree:
        description: 'Step: Remove stale build worktree'
        required: false
        default: false
        type: boolean
      run_free_disk:
        description: 'Step: Free disk space'
        required: false
        default: false
        type: boolean
      run_set_swap:
        description: 'Step: Set swap space'
        required: false
        default: false
        type: boolean
      run_packages:
        description: 'Step: Install host packages'
        required: false
        default: false
        type: boolean
      run_setup_swap:
        description: 'Step: Setup build swap'
        required: false
        default: false
        type: boolean
      run_capacity:
        description: 'Step: Check runner capacity'
        required: false
        default: false
        type: boolean
      run_repo_tool:
        description: 'Step: Install repo tool'
        required: false
        default: false
        type: boolean
      run_sync:
        description: 'Step: Sync OrangeFox sources'
        required: false
        default: true
        type: boolean
      run_install_devicetree:
        description: 'Step: Install klee device tree'
        required: false
        default: true
        type: boolean
      run_build_vendorboot:
        description: 'Step: Build vendor_boot image'
        required: false
        default: true
        type: boolean
      run_collect_artifact:
        description: 'Step: Collect release artifact'
        required: false
        default: true
        type: boolean
      run_upload_release_artifact:
        description: 'Step: Upload release artifact'
        required: false
        default: true
        type: boolean
      run_upload_diag:
        description: 'Step: Upload build diagnostics'
        required: false
        default: true
        type: boolean
      run_clean:
        description: 'Step: Clean build worktree'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: orangefox-klee-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORANGEFOX_BRANCH: '14.1'
  ORANGEFOX_TOP: ${{ github.workspace }}/OrangeFox
  ORANGEFOX_SYNC: ${{ github.workspace }}/sync
  OF_BUILD_JOBS: '1'

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      - name: Check out device tree
        if: ${{ inputs.run_checkout != false }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: device-tree

      - name: Set build metadata
        id: metadata
        if: ${{ inputs.run_metadata != false }}
        shell: bash
        run: |
          set -euo pipefail

          image_name="OrangeFox-R12.0-Unofficial-klee-system-compatible.img"

          echo "artifact_name=orangefox-klee-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Remove stale build worktree
        if: ${{ inputs.run_remove_worktree != false }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP" \
            "$GITHUB_WORKSPACE/sync" \
            "$GITHUB_WORKSPACE/artifacts"
          rm -f "$GITHUB_WORKSPACE/ci-gitconfig" \
            "$GITHUB_WORKSPACE/orangefox-build.log"

      - name: Free disk space
        if: ${{ inputs.run_free_disk != false }}
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set swap space
        if: ${{ inputs.run_set_swap != false }}
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install host packages
        if: ${{ inputs.run_packages != false }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lz4 openjdk-17-jdk-headless pngcrush \
            python-is-python3 python3 ripgrep rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev device-tree-compiler
          sudo apt-get clean
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          test -x "${java_home}/bin/java"
          echo "JAVA_HOME=${java_home}" >> "$GITHUB_ENV"

      - name: Setup build swap
        if: ${{ inputs.run_setup_swap != false }}
        shell: bash
        run: |
          set -euo pipefail
          MIN_SWAP_GIB=12 \
            bash "$GITHUB_WORKSPACE/device-tree/.github/scripts/setup-swap.sh"

      - name: Check runner capacity
        if: ${{ inputs.run_capacity != false }}
        shell: bash
        run: |
          set -euo pipefail

          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib=$((95 * 1024 * 1024))
          if [[ -z "${available_kib}" || "${available_kib}" -lt "${required_kib}" ]]; then
            available_gib=$((available_kib / 1024 / 1024))
            echo "::error::OrangeFox klee needs at least 95 GiB free after hosted-image cleanup and swap setup; found ${available_gib} GiB."
            echo "::error::Use a GitHub-hosted larger runner if this public standard runner image cannot meet the guard."
            exit 1
          fi

          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          required_memory_kib=$((14 * 1024 * 1024))
          if [[ -z "${memory_kib}" || "${memory_kib}" -lt "${required_memory_kib}" ]]; then
            memory_gib=$((memory_kib / 1024 / 1024))
            echo "::error::This workflow needs a public 16 GB-class GitHub-hosted runner; found ${memory_gib} GiB RAM."
            exit 1
          fi

          df -h "$GITHUB_WORKSPACE"
          free -h

      - name: Install repo tool
        if: ${{ inputs.run_repo_tool != false }}
        shell: bash
        run: |
          set -euo pipefail
          install -d "$HOME/bin"
          curl --fail --location --retry 5 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync OrangeFox sources
        if: ${{ inputs.run_sync != false }}
        shell: bash
        run: |
          set -euo pipefail

          git config --global protocol.file.allow always
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 600

          mkdir -p "$ORANGEFOX_TOP"
          git clone https://github.com/xiaomi-klee-devs/android_sync.git \
            "$ORANGEFOX_SYNC"

          cd "$ORANGEFOX_SYNC"
          ./orangefox_sync.sh --branch 14.1 --path "$ORANGEFOX_TOP"

      - name: Install klee device tree
        if: ${{ inputs.run_install_devicetree != false }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ORANGEFOX_TOP/device/xiaomi/klee"
          rsync -a --delete \
            --exclude .git \
            --exclude images \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$ORANGEFOX_TOP/device/xiaomi/klee/"

      - name: Build vendor_boot image
        if: ${{ inputs.run_build_vendorboot != false }}
        shell: bash
        working-directory: ${{ env.ORANGEFOX_TOP }}
        env:
          ALLOW_MISSING_DEPENDENCIES: 'true'
          FOX_BUILD_DEVICE: klee
          FOX_AB_DEVICE: '1'
          FOX_VIRTUAL_AB_DEVICE: '1'
          OF_FORCE_PREBUILT_KERNEL: '1'
          OF_LOW_MEMORY_BUILD: '1'
          GOMEMLIMIT: '3GiB'
          GOGC: '20'
          _JAVA_OPTIONS: '-Xmx3g'
          USE_CCACHE: '0'
        run: |
          set -euo pipefail
          build_jobs="$(nproc)"
          export OF_BUILD_JOBS="$build_jobs"
          export NINJA_ARGS="-j${build_jobs} -l${build_jobs}"
          export SOONG_UI_NINJA_ARGS="$NINJA_ARGS"
          printf 'Using %s Ninja jobs\n' "$build_jobs"

          device/xiaomi/klee/tools/compile.sh vendorbootimage 2>&1 | \
            tee "$GITHUB_WORKSPACE/orangefox-build.log"

      - name: Collect release artifact
        if: ${{ inputs.run_collect_artifact != false }}
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.metadata.outputs.image_name }}
        run: |
          set -euo pipefail
          product="$ORANGEFOX_TOP/out/target/product/klee"
          image="$product/$IMAGE_NAME"

          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -fp "$image" "$GITHUB_WORKSPACE/artifacts/$IMAGE_NAME"
          (
            cd "$GITHUB_WORKSPACE/artifacts"
            sha256sum "$IMAGE_NAME" > "${IMAGE_NAME}.sha256"
          )

          cat > "$GITHUB_WORKSPACE/artifacts/build-info.md" <<EOF
          Automated OrangeFox build for klee.

          - Device-tree commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - OrangeFox branch: ${ORANGEFOX_BRANCH}
          - GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This artifact contains the validated, system-compatible vendor_boot image.
          EOF

      - name: Upload release artifact
        if: ${{ inputs.run_upload_release_artifact != false }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: ${{ always() && inputs.run_upload_diag != false }}
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-klee-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            orangefox-build.log
            OrangeFox/out/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Clean build worktree
        if: ${{ always() && inputs.run_clean != false }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP" \
            "$GITHUB_WORKSPACE/sync" \
            "$GITHUB_WORKSPACE/artifacts"
          rm -f "$GITHUB_WORKSPACE/ci-gitconfig" \
            "$GITHUB_WORKSPACE/orangefox-build.log"

  release:
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/klee' && (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: orangefox-klee-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts
          merge-multiple: true

      - name: Verify images
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          image="OrangeFox-R12.0-Unofficial-klee-system-compatible.img"
          test -f "${image}"
          test -f "${image}.sha256"
          sha256sum --check --strict "${image}.sha256"

      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="klee-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          notes="$GITHUB_WORKSPACE/release-notes.md"
          cat > "$notes" <<EOF
          Automated OrangeFox build for klee.

          - Device-tree commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - OrangeFox branch: ${ORANGEFOX_BRANCH}
          - GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This prerelease contains a validated system-compatible vendor_boot image.
          EOF

          gh release create "$release_tag" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-klee-system-compatible.img" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-klee-system-compatible.img.sha256" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "OrangeFox klee CI ${GITHUB_SHA::7}" \
            --notes-file "$notes" \
            --prerelease
