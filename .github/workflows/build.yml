name: OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      branch:
        description: OrangeFox sync branch
        required: true
        default: "14.1"
      lunch:
        description: Lunch target
        required: true
        default: "twrp_klee-ap2a-eng"
      build_target:
        description: Build target
        required: true
        default: "recoveryimage"
      runner:
        description: Runner label
        required: true
        default: "ubuntu-latest"
      build_jobs:
        description: Parallel build jobs
        required: true
        default: "1"

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 720

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Free up disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lz4 pngcrush rsync schedtool \
            squashfs-tools unzip xsltproc zip zlib1g-dev mkbootimg

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show runner resources
        shell: bash
        run: |
          df -h
          free -h
          swapon --show

      - name: Sync OrangeFox
        shell: bash
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "Heartbeat..."
              df -h
              free -h
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT

          git clone https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/ofox-sync"
          cd "$GITHUB_WORKSPACE/ofox-sync"

          ./orangefox_sync.sh \
            --branch "${{ inputs.branch }}" \
            --path "$GITHUB_WORKSPACE/OrangeFox"

          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT

      - name: Copy klee device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox/device/xiaomi"

          rsync -a --delete \
            --exclude ".git" \
            --exclude "images" \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$GITHUB_WORKSPACE/OrangeFox/device/xiaomi/klee/"

      - name: Verify prebuilts
        shell: bash
        run: |
          set -euo pipefail
          ls -lh "$GITHUB_WORKSPACE/OrangeFox/device/xiaomi/klee/prebuilt/vendor_boot_stock.img"
          ls -lh "$GITHUB_WORKSPACE/OrangeFox/device/xiaomi/klee/prebuilt/vendor_ramdisk00" || true

      - name: Free space
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/OrangeFox/.repo"
          rm -rf "$GITHUB_WORKSPACE/ofox-sync"
          df -h
          free -h

      - name: Build OrangeFox
        shell: bash
        working-directory: ${{ github.workspace }}/OrangeFox
        env:
          ALLOW_MISSING_DEPENDENCIES: "true"
          FOX_BUILD_DEVICE: klee
          FOX_AB_DEVICE: "1"
          FOX_VIRTUAL_AB_DEVICE: "1"
          OF_FORCE_PREBUILT_KERNEL: "1"
          OF_LOW_MEMORY_BUILD: "1"
          OF_BUILD_JOBS: "1"
          NINJA_ARGS: "-j1 -l1"
          SOONG_UI_NINJA_ARGS: "-j1 -l1"
          USE_CCACHE: "0"
          GOMAXPROCS: "1"
          GOGC: "20"
          GOMEMLIMIT: "3GiB"
          _JAVA_OPTIONS: "-Xmx3g"
        run: |
          set -eo pipefail
          source build/envsetup.sh
          lunch "${{ inputs.lunch }}"
          mka -j1 adbd "${{ inputs.build_target }}" 2>&1 | tee "$GITHUB_WORKSPACE/orangefox-build.log"

      - name: Locate recovery ramdisk
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$GITHUB_WORKSPACE/OrangeFox/out/target/product/klee"

          echo "::group::Full product file tree"
          find "$PRODUCT" -type f | sort | tee "$GITHUB_WORKSPACE/product_files.txt" || true
          echo "::endgroup::"

          echo "::group::Inside the OrangeFox flashable zip"
          ZIP="$(find "$PRODUCT" -maxdepth 1 -name '*.zip' | head -n1)"
          if [ -n "$ZIP" ]; then
            unzip -l "$ZIP" | tee "$GITHUB_WORKSPACE/zip_contents.txt" || true
          else
            echo "No zip found at $PRODUCT"
          fi
          echo "::endgroup::"

          RECOVERY_CPIO=""

          # Known candidate paths from older/AB device trees
          for f in \
            "$PRODUCT/vendor_ramdisk_recovery.cpio" \
            "$PRODUCT/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.lz4" \
            "$PRODUCT/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk.cpio.lz4" \
            "$PRODUCT/ramdisk-recovery.img" \
            "$PRODUCT/ramdisk-recovery.cpio"
          do
            if [ -f "$f" ]; then
              RECOVERY_CPIO="$f"
              break
            fi
          done

          # Fallback: search by name pattern anywhere under $PRODUCT
          if [ -z "$RECOVERY_CPIO" ]; then
            RECOVERY_CPIO="$(find "$PRODUCT" -type f \( -iname "*recovery*ramdisk*" -o -iname "*ramdisk*recovery*" -o -iname "recovery.cpio*" \) | head -n1)"
          fi

          if [ -z "$RECOVERY_CPIO" ]; then
            echo "::warning::No standalone recovery ramdisk cpio found. Check zip_contents.txt / product_files.txt artifacts -- this device tree may already output a ready vendor_boot.img or recovery.img directly, in which case the manual repack step is unnecessary and should be skipped."
            echo "" > "$GITHUB_WORKSPACE/recovery_cpio_path.txt"
          else
            echo "$RECOVERY_CPIO" > "$GITHUB_WORKSPACE/recovery_cpio_path.txt"
            ls -lh "$RECOVERY_CPIO"
          fi

      - name: Repack stock vendor_boot with OrangeFox recovery
        shell: bash
        run: |
          set -euo pipefail

          RECOVERY_CPIO="$(cat "$GITHUB_WORKSPACE/recovery_cpio_path.txt" 2>/dev/null || true)"
          if [ -z "$RECOVERY_CPIO" ]; then
            echo "::warning::Skipping manual vendor_boot repack -- no standalone recovery cpio was found. Check the zip_contents.txt artifact for a ready-made vendor_boot.img/recovery.img instead."
            exit 0
          fi

          PRODUCT="$GITHUB_WORKSPACE/OrangeFox/out/target/product/klee"
          STOCK="$GITHUB_WORKSPACE/OrangeFox/device/xiaomi/klee/prebuilt/vendor_boot_stock.img"
          OUT="$PRODUCT/vendor_boot_patched.img"
          UNPACK="$PRODUCT/stock_vendor_boot"

          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"

          unpack_bootimg --boot_img "$STOCK" --out "$UNPACK"

          # Decompress the OrangeFox-built recovery ramdisk if it's still lz4-compressed,
          # since mkbootimg expects a raw cpio per --vendor_ramdisk_fragment.
          RECOVERY_RAW="$PRODUCT/recovery_ramdisk.cpio"
          if file "$RECOVERY_CPIO" | grep -qi lz4; then
            lz4 -d "$RECOVERY_CPIO" -c > "$RECOVERY_RAW"
          else
            cp "$RECOVERY_CPIO" "$RECOVERY_RAW"
          fi

          RUNNER_MKBOOTIMG="$(command -v mkbootimg)"

          "$RUNNER_MKBOOTIMG" \
            --vendor_boot "$OUT" \
            --header_version 4 \
            --pagesize 0x00001000 \
            --base 0x00000000 \
            --kernel_offset 0x40000000 \
            --ramdisk_offset 0x66f00000 \
            --tags_offset 0x47c80000 \
            --dtb_offset 0x0000000047c80000 \
            --vendor_cmdline "bootopt=64S3,32N2,64N2 erofs.reserved_pages=64" \
            --dtb "$UNPACK/dtb" \
            --vendor_bootconfig "$UNPACK/bootconfig" \
            --ramdisk_type 1 --ramdisk_name '' --vendor_ramdisk_fragment "$UNPACK/vendor_ramdisk00" \
            --ramdisk_type 2 --ramdisk_name recovery --vendor_ramdisk_fragment "$RECOVERY_RAW"

          unpack_bootimg --boot_img "$OUT" | tee "$GITHUB_WORKSPACE/vendor_boot_patched_info.txt"

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          PRODUCT="$GITHUB_WORKSPACE/OrangeFox/out/target/product/klee"

          if [ -d "$PRODUCT" ]; then
            find "$PRODUCT" \
              -maxdepth 1 \
              -type f \
              \( -name "*.img" -o -name "*.zip" -o -name "*.txt" \) \
              -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          fi

          cp -v "$GITHUB_WORKSPACE/orangefox-build.log" "$GITHUB_WORKSPACE/artifacts/" || true
          cp -v "$GITHUB_WORKSPACE/vendor_boot_patched_info.txt" "$GITHUB_WORKSPACE/artifacts/" || true
          cp -v "$GITHUB_WORKSPACE/product_files.txt" "$GITHUB_WORKSPACE/artifacts/" || true
          cp -v "$GITHUB_WORKSPACE/zip_contents.txt" "$GITHUB_WORKSPACE/artifacts/" || true
          cp -v "$GITHUB_WORKSPACE/recovery_cpio_path.txt" "$GITHUB_WORKSPACE/artifacts/" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-klee
          path: artifacts
          if-no-files-found: warn
